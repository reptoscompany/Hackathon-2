<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Puducherry Police crest">
  <defs>
    <path id="ppRing" d="M100,78 a40,40 0 1,1 -0.2,0" fill="none"/>
  </defs>
  <!-- Shield base -->
  <path d="M30,32 C55,44 75,46 100,36 C125,26 145,32 170,38 L170,128 C170,176 138,206 100,222 C62,206 30,176 30,128 Z"
        fill="#C0271B" stroke="#8F1D12" stroke-width="4" stroke-linejoin="round"/>
  <!-- Inner gold border -->
  <path d="M40,44 C60,54 78,55 100,47 C122,39 140,43 160,48 L160,128 C160,170 132,197 100,211 C68,197 40,170 40,128 Z"
        fill="none" stroke="#D9A62E" stroke-width="4" stroke-linejoin="round"/>
  <!-- Top pillar emblem (simplified) -->
  <g fill="#D9A62E">
    <circle cx="100" cy="52" r="5"/>
    <rect x="96" y="57" width="8" height="10" rx="2"/>
    <rect x="91" y="67" width="18" height="4" rx="1.5"/>
  </g>
  <!-- Ring -->
  <circle cx="100" cy="118" r="40" fill="none" stroke="#D9A62E" stroke-width="3"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="12" letter-spacing="4.5" fill="#E3B341">
    <textPath href="#ppRing" startOffset="1%">PUDUCHERRY POLICE ★</textPath>
  </text>
  <!-- Inner medallion + PP monogram -->
  <circle cx="100" cy="120" r="21" fill="none" stroke="#D9A62E" stroke-width="2.5"/>
  <text x="100" y="132" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="32" fill="#E3B341">PP</text>
  <!-- Star below medallion -->
  <polygon points="100,162 102.2,167.2 107.8,167.4 103.4,170.8 104.9,176.2 100,173 95.1,176.2 96.6,170.8 92.2,167.4 97.8,167.2" fill="#D9A62E"/>
  <!-- Ribbon -->
  <polygon points="45,182 30,178 34,190 30,202 45,198" fill="#A31515" stroke="#D9A62E" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="155,182 170,178 166,190 170,202 155,198" fill="#A31515" stroke="#D9A62E" stroke-width="2" stroke-linejoin="round"/>
  <rect x="45" y="182" width="110" height="16" fill="#A31515" stroke="#D9A62E" stroke-width="2"/>
</svg>
